name: gnss-fetch
on:
  schedule: [{cron: "0 21 * * *"}]   # 毎日 06:00 JST
  workflow_dispatch:
permissions: {contents: write}
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install paramiko
      - run: python gnss_fetch.py
        env:
          GSI_SFTP_USER: ${{ secrets.GSI_SFTP_USER }}
          GSI_SFTP_PASS: ${{ secrets.GSI_SFTP_PASS }}
      - run: |
          git config user.name github-actions; git config user.email actions@github.com
          git add gnss_vectors.json; git diff --cached --quiet || git commit -m "gnss: update" && git push
